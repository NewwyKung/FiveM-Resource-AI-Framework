name: Validate resource

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: resource/ui/package-lock.json
      - run: npm ci --prefix resource/ui --no-audit --no-fund
      - run: npm run validate
      - name: Install pinned LuaLS outside the workspace
        run: |
          VERSION="$(node -p "JSON.parse(require('fs').readFileSync('tooling.config.json', 'utf8')).luaLanguageServer.version")"
          INSTALL_DIR="$RUNNER_TEMP/luals"
          mkdir -p "$INSTALL_DIR"
          curl --fail --location --silent --show-error \
            "https://github.com/LuaLS/lua-language-server/releases/download/${VERSION}/lua-language-server-${VERSION}-linux-x64.tar.gz" \
            | tar -xz -C "$INSTALL_DIR"
          echo "LUALS_BIN=$INSTALL_DIR/bin/lua-language-server" >> "$GITHUB_ENV"
      - run: npm run check:lua
