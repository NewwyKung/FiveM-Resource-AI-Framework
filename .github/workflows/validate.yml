name: Validate

on:
  push:
    branches: ['main']
  pull_request:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate script syntax
        run: |
          node --check scripts/validate-template.mjs
          node --check scripts/validate-integrations.mjs
          node --check scripts/build-ai-index.mjs
          node --check scripts/create-release.mjs
          node --check tests/release/create-release.integration.mjs

      - name: Validate template structure
        run: node scripts/validate-template.mjs

      - name: Validate integration declarations
        run: node scripts/validate-integrations.mjs

      - name: Validate AI registry index
        run: node scripts/build-ai-index.mjs --check

      - name: Validate release policy
        run: node -e "JSON.parse(require('node:fs').readFileSync('release.config.json', 'utf8'))"

      - name: Generate UI dependency lock when missing
        run: |
          if [ ! -f ui/package-lock.json ]; then
            npm install --prefix ui --package-lock-only --ignore-scripts --no-audit --no-fund
          fi

      - name: Commit generated UI lockfile to PR branch
        if: github.event_name == 'pull_request'
        run: |
          if ! git diff --quiet -- ui/package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add ui/package-lock.json
            git commit -m "chore(ui): add dependency lockfile"
            git push origin HEAD:${GITHUB_HEAD_REF}
          fi

      - name: Install UI dependencies
        run: npm ci --prefix ui --no-audit --no-fund

      - name: Build UI
        run: npm run build --prefix ui

      - name: Dry-run release builder
        run: node scripts/create-release.mjs --dry-run --skip-ui-build

      - name: Build and inspect release package
        run: node tests/release/create-release.integration.mjs
