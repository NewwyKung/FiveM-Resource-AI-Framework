name: Validate

on:
  push:
    branches: ['main']
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate template structure
        run: node scripts/validate-template.mjs

      - name: Validate integration declarations
        run: node scripts/validate-integrations.mjs

      - name: Install UI dependencies
        run: npm install --prefix ui --no-audit --no-fund

      - name: Build UI
        run: npm run build --prefix ui
